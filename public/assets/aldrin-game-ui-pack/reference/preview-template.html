<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aldrin's World · Game UI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1b2d;color:#e9dcb7;font-family:'Courier New',monospace}body:before{content:'';position:fixed;inset:0;background:linear-gradient(#081624bb,#081624e8),var(--world) center/cover;z-index:-1}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d6b764;outline-offset:4px}.top{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:22px 4vw}.brand{font-size:20px;color:#a6d5c0;font-weight:bold}.top small{display:block;font-size:12px;color:#a2b5b9;margin-top:5px}.mode{background:#1b3540;color:#dacda9;border:1px solid #66887d;padding:9px 12px}.viewport{overflow:auto;padding:0 16px 8px}.panel{position:relative;width:min(1152px,100%);aspect-ratio:3/2;margin:auto;container-type:inline-size;isolation:isolate;color:#273a3b}.art{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}.close{position:absolute;right:3.5%;top:3%;width:3.8%;aspect-ratio:1;border:2px solid #bca368;background:#203a40;color:#f0dfb4;font-weight:bold;font-size:2cqw;z-index:3}.zone{position:absolute;overflow:auto;scrollbar-width:thin;font-size:1.7cqw;line-height:1.45}.zone h1,.zone h2,.zone h3{line-height:1.15;margin:0 0 .65em}.zone h1{font-size:2.6cqw;letter-spacing:-.07em}.zone h2{font-size:2.5cqw;letter-spacing:-.055em}.zone h3{font-size:2cqw}.zone p{margin:0 0 1em}.zone small{font-size:1.35cqw}.title{display:flex;align-items:center;overflow:visible;white-space:nowrap}.title h1{margin:0}.darktitle{color:#eadfba}.portrait{object-fit:contain;width:100%;height:100%;display:block}.button{border:0;background:none;color:inherit;width:100%;height:100%;font-weight:bold;font-size:1.6cqw}.entry{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #ab9365;padding:1.2cqw .8cqw;background:none;color:#294041;font-size:1.6cqw;margin-bottom:.5cqw}.entry b{display:block;font-size:1.8cqw}.entry small{display:block;margin-top:.5cqw}.entry[aria-pressed=true]{background:#c4ba8b;box-shadow:inset 4px 0 #38605a}.detail{padding:1.7cqw 1cqw}.tag{display:inline-block;border-bottom:2px solid #9e814f;margin-bottom:1.5cqw;font-size:1.25cqw;font-weight:bold}.arrow{background:transparent;border:0;cursor:pointer}.award{border:0;background:transparent;border-radius:0}.award[aria-pressed=true]{outline:2px solid #e5d191;outline-offset:6px}.certificate{padding:.2cqw;font-size:1.5cqw}.certificate[aria-pressed=true]{box-shadow:inset 0 -3px #50766b}.tool{border:0;background:none;color:#b0daca;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:bold;gap:.5cqw}.tool b{font-size:3.2cqw}.tool span{font-size:1.25cqw}.tool[aria-pressed=true]{box-shadow:inset 0 0 0 3px #b8dcc6;background:#a6d5c016}.toolsfoot{text-align:center;color:#aacaba;font-size:1.1cqw;overflow:visible}.address-card{padding:.7cqw 1cqw}.address-card h3{margin:0 0 .3em}.form{padding:1cqw 1.6cqw}.form h1{font-size:2.8cqw}.form label{display:block;font-weight:bold;font-size:1.25cqw;margin:.7cqw 0 .2cqw}.form input,.form textarea{width:100%;border:0;border-bottom:1px solid #9b895f;background:#efe1b980;color:#203a40;font-size:1.5cqw;padding:.7cqw;resize:none;border-radius:0}.form textarea{height:7cqw}.submit{background:#234941;color:#e8dcba;border:2px solid #648b76;padding:.7cqw 1.4cqw;font-size:1.5cqw;margin-top:.8cqw}.status{font-size:1.1cqw;margin-top:.8cqw}.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:18px 12px 28px}.nav button{border:1px solid #52736b;box-shadow:0 3px #08141f;background:#172f39;color:#bdc9c3;font-size:14px;padding:12px 17px}.nav button[aria-current=page]{background:#9dd0b9;border-color:#d9e8cb;color:#102b2c}.hint{text-align:center;margin:0;padding-bottom:16px;color:#8eabae;font-size:12px}.reopen{display:block;margin:160px auto;background:#97cbb9;border:3px solid #d3dfbc;padding:18px 28px;color:#132e34;font-size:20px}.hidden{display:none!important}
@media(max-width:700px){.top{padding:16px}.brand{font-size:16px}.top small{max-width:200px}.panel{width:800px;max-width:none}.viewport{padding:0 8px}.nav{justify-content:flex-start;flex-wrap:nowrap;overflow:auto}.nav button{white-space:nowrap;padding:12px}.hint{text-align:left;padding:0 16px 16px}}
@media(prefers-reduced-motion:no-preference){.panel{animation:inspect .18s ease-out}@keyframes inspect{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}}
</style></head><body>
<header class="top"><div class="brand">Aldrin's world.<small>Inspect a little of the person behind the player.</small></div><button id="mode" class="mode">Renderer: PNG</button></header>
<div class="viewport"><main class="panel" id="panel" aria-label="Portfolio section"></main></div><button class="reopen hidden" id="reopen">Open portfolio</button>
<nav class="nav" aria-label="Portfolio sections" id="nav"></nav><p class="hint">Select an object to inspect it · Esc to return · On small screens, swipe the panel sideways</p>
<script>
const DATA=/*PACK_DATA*/;
/*RENDERER*/
document.body.style.setProperty('--world',`url("${DATA.world}")`);
const panel=document.querySelector('#panel'),nav=document.querySelector('#nav');
const names={about:'About',experience:'Experience',achievements:'Achievements',tools:'Tools of the trade',contact:'Contact'};
const projects=[{title:'Aadi',type:'Mobile application',body:'A rental marketplace bringing space rentals, utility vehicles and local services together.',note:'Flutter · Product development'},{title:'ICT planning',type:'University systems',body:'Resource requirements, delivery tracking and gap analysis brought into one planning workflow.',note:'Laravel · Resource planning'},{title:'This pixel world',type:'Interactive portfolio',body:'A portfolio explored through movement, jumping and objects that reveal the work behind them.',note:'Vue · JavaScript · Game interfaces'}];
const achievements=[{title:'CS50x',type:'Coursework · 2023',body:'Harvard University’s introductory computer science course.'},{title:'BS Electronics Engineering',type:'Education · 2014–2019',body:'Samar State University'},{title:'Secondary education',type:'Education · 2010–2014',body:'Samar National School'}];
const toolsList=[{mark:'JS',name:'JavaScript',body:'Interactive interfaces and the behavior behind this game world.',type:'Language'},{mark:'Vue',name:'Vue',body:'Components and state for web interfaces.',type:'Frontend'},{mark:'PHP',name:'Laravel',body:'Web applications, data workflows and resource planning.',type:'Backend'},{mark:'Dart',name:'Flutter',body:'Mobile app interfaces and cross-platform development.',type:'Mobile'},{mark:'Git',name:'Git',body:'Version control and a record of how a project evolves.',type:'Workflow'},{mark:'SQL',name:'SQL',body:'Structured data, queries and application records.',type:'Data'}];
let active='about',procedural=false,selectedProject=0,selectedAward=0,selectedTool=0;
const drafts={name:'',email:'',message:''};
const sources={};
function source(id){if(!procedural)return DATA.images[id];if(!sources[id]){const a=DATA.atlases[id],c=document.createElement('canvas');c.width=384;c.height=256;drawProcedural(c.getContext('2d'),a,'panel',0,0);sources[id]=c.toDataURL();}return sources[id];}
function zone(name,tag='div',className=''){const r=DATA.atlases[active].ui.regions[name],el=document.createElement(tag);el.className='zone '+className;Object.assign(el.style,{left:r.x/384*100+'%',top:r.y/256*100+'%',width:r.w/384*100+'%',height:r.h/256*100+'%'});panel.append(el);return el;}
function title(text,dark=false){zone('title','div','title '+(dark?'darktitle':'')).innerHTML='<h1>'+text+'</h1>';}
function details(el,data){el.innerHTML='<span class="tag">'+data.type+'</span><h2>'+data.title+'</h2><p>'+data.body+'</p>'+(data.note?'<small>'+data.note+'</small>':'');}
function open(id){active=id;panel.classList.remove('hidden');document.querySelector('#reopen').classList.add('hidden');render();}
function close(){panel.classList.add('hidden');document.querySelector('#reopen').classList.remove('hidden');document.querySelector('#reopen').focus();}
function render(){
 panel.replaceChildren();panel.dataset.section=active;
 const art=document.createElement('img');art.src=source(active);art.className='art';art.alt='';panel.append(art);
 const closeButton=document.createElement('button');closeButton.className='close';closeButton.textContent='×';closeButton.ariaLabel='Return to game';closeButton.onclick=close;panel.append(closeButton);
 for(const b of nav.children)b.setAttribute('aria-current',b.dataset.section===active?'page':'false');
 if(active==='about'){
  title('Meet Aldrin');
  const img=document.createElement('img');img.src=DATA.photo;img.alt='Aldrin Jay B. Delos Reyes';img.className='portrait';zone('portrait').append(img);
  zone('body','div','detail').innerHTML='<span class="tag">The person behind the player</span><h2>Aldrin Jay B.<br>Delos Reyes</h2><p>Developer.<br>Engineer.<br>Curious human.</p><p>Welcome to my world. Explore the work, tools and milestones behind it.</p>';
  const b=zone('footer','button','button');b.textContent='Explore my experience';b.onclick=()=>open('experience');
 }else if(active==='experience'){
  title('Experience');const list=zone('entries');const detail=zone('details','div','detail');
  function select(i){selectedProject=(i+projects.length)%projects.length;details(detail,projects[selectedProject]);for(const [j,b] of [...list.children].entries())b.setAttribute('aria-pressed',j===selectedProject);}
  projects.forEach((p,i)=>{const b=document.createElement('button');b.className='entry';b.innerHTML='<b>'+p.title+'</b><small>'+p.type+'</small>';b.onclick=()=>select(i);list.append(b);});
  for(const [name,step] of [['previous',-1],['next',1]]){const b=zone(name,'button','arrow');b.ariaLabel=step<0?'Previous experience':'Next experience';b.onclick=()=>select(selectedProject+step);}select(selectedProject);
 }else if(active==='achievements'){
  title('Milestones collected',true);const detail=zone('details','div','detail');const buttons=[];
  function select(i){selectedAward=i;details(detail,achievements[i]);buttons.forEach((b,j)=>b.setAttribute('aria-pressed',j===i));}
  ['bronze','silver','gold'].forEach((region,i)=>{const b=zone(region,'button','award');b.ariaLabel=achievements[i].title;b.title=achievements[i].title;b.onclick=()=>select(i);buttons.push(b);});
  const edu=zone('certificate1','button','button certificate');edu.innerHTML='Education<br><small>Two chapters</small>';edu.onclick=()=>select(selectedAward===1?2:1);
  const course=zone('certificate2','button','button certificate');course.innerHTML='Coursework<br><small>CS50x · 2023</small>';course.onclick=()=>select(0);select(selectedAward);
 }else if(active==='tools'){
  title('Tools of the trade',true);const detail=zone('details','div','detail'),buttons=[];
  function select(i){selectedTool=i;details(detail,{title:toolsList[i].name,type:toolsList[i].type,body:toolsList[i].body});buttons.forEach((b,j)=>b.setAttribute('aria-pressed',i===j));}
  toolsList.forEach((t,i)=>{const b=zone('slot'+(i+1),'button','tool');b.innerHTML='<b>'+t.mark+'</b><span>'+t.name+'</span>';b.onclick=()=>select(i);buttons.push(b);});zone('footer','div','toolsfoot').textContent='Select a tool to inspect';select(selectedTool);
 }else if(active==='contact'){
  const form=zone('letter','form','form');form.innerHTML='<h1>Leave a message</h1><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="message">Your message</label><textarea id="message" name="message" required></textarea><button class="submit" type="submit">Copy letter</button><div class="status" role="status"></div>';
  for(const key of Object.keys(drafts)){form.elements[key].value=drafts[key];form.elements[key].oninput=e=>drafts[key]=e.target.value;}
  form.onsubmit=async e=>{e.preventDefault();const text='To Aldrin\nFrom: '+drafts.name+' <'+drafts.email+'>\n\n'+drafts.message;let copied=false;try{await navigator.clipboard.writeText(text);copied=true;}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();copied=document.execCommand('copy');area.remove();}form.querySelector('.status').textContent=copied?'Letter copied. Nothing has been sent.':'Copy unavailable. Select and copy your message manually.';};
  zone('address','div','address-card').innerHTML='<h3>To Aldrin</h3><small>Let’s talk.</small>';
 }
}
Object.entries(names).forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.dataset.section=id;b.onclick=()=>open(id);nav.append(b);});
document.querySelector('#mode').onclick=e=>{procedural=!procedural;e.target.textContent='Renderer: '+(procedural?'Procedural':'PNG');render();};
document.querySelector('#reopen').onclick=()=>{open(active);panel.querySelector('.close').focus();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
render();
</script></body></html>
